<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ronin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-card">
    <span class="seal seal-lg" aria-hidden="true">浪人</span>
    <h1>ronin</h1>
    <p>Entrá con tu cuenta de GitHub para ver lo que está haciendo ronin. Lo que pidas desde acá, GitHub lo muestra a tu nombre.</p>
    <a class="btn" href="/api/auth/login">Entrar con GitHub</a>
  </div>
</div>

<div class="shell" id="shell" data-m="list" hidden>
  <aside class="side" aria-label="Trabajo de ronin">
    <div class="brand"><span class="seal" aria-hidden="true">浪人</span><b>ronin</b></div>
    <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar issue, PR o tarea" aria-label="Buscar"></label>
    <div class="quick" id="quick"></div>
    <div class="tree" id="tree"></div>
  </aside>
  <main class="center" id="center"></main>
  <aside class="ctx" id="ctx" aria-label="Contexto"></aside>
  <footer class="bar-s" id="statusbar"></footer>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
