name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests that need a real Postgres (src/db/testing.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ronin
          POSTGRES_PASSWORD: ronin
          POSTGRES_DB: ronin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ronin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ronin:ronin@localhost:5432/ronin_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
